name: Build Kimi K2.6 UDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-setuptools python3-venv \
          build-essential git autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev libltdl-dev \
          openjdk-17-jdk \
          liblzma-dev libsqlite3-dev libbz2-dev libreadline-dev
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip setuptools
        python3 -m pip install buildozer cython virtualenv
    
    - name: Build APK
      run: |
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        buildozer android debug 2>&1 | tee build.log
      env:
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: kimi-ude-apk
        path: ./bin/*.apk
        retention-days: 30
    
    - name: Build summary
      if: always()
      run: |
        APK_FILE=$(ls ./bin/*.apk 2>/dev/null | head -1)
        if [ -n "$APK_FILE" ]; then
          APK_NAME=$(basename "$APK_FILE")
          echo "### ✅ APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "📱 File: \`$APK_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download from the Artifacts section below" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ APK Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the build logs for errors" >> $GITHUB_STEP_SUMMARY
        fi
