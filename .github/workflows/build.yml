name: Build Kimi K2.6 UDE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev libltdl-dev \
          liblzma-dev libsqlite3-dev libbz2-dev libreadline-dev
    
    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip setuptools
        python3 -m pip install buildozer cython virtualenv
    
    - name: Build APK with Buildozer
      run: |
        buildozer android debug 2>&1 | tee build.log
      env:
        JAVA_HOME: ${{ steps.setup-java.outputs.path }}
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kimi-ude-apk
        path: |
          ./bin/*.apk
          ./build.log
        retention-days: 30
    
    - name: Build summary
      if: always()
      run: |
        APK_FILE=$(ls ./bin/*.apk 2>/dev/null | head -1)
        if [ -n "$APK_FILE" ]; then
          APK_NAME=$(basename "$APK_FILE")
          echo "### ✅ APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "📱 File: \`$APK_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download from the Artifacts section below" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ APK Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the build logs for errors" >> $GITHUB_STEP_SUMMARY
        fi
